name: BectanseTrack
options:
  bundleIdPrefix: com.bectanse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  BectanseTrack:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 72C5MFHM2S
        PRODUCT_BUNDLE_IDENTIFIER: com.bectanse.track
        PRODUCT_NAME: Bectanse Track
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bectanse Track
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: false
