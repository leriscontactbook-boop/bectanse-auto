<style>
  .m-univ-nav{display:none}
  @media(max-width:768px){
    .m-univ-nav{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1000;
      height:calc(68px + env(safe-area-inset-bottom));
      padding:0 4px env(safe-area-inset-bottom);box-sizing:border-box;
      overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;
      background:rgba(3,4,3,.98);border-top:1px solid rgba(255,101,0,.48);
    }
    .m-univ-nav::-webkit-scrollbar{display:none}
    .m-univ-nav-item{
      flex:1 0 64px;height:68px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:3px;text-decoration:none;
      color:#656762;font-family:'Barlow Condensed',Arial,sans-serif;
      font-size:11px;font-weight:800;line-height:1;text-transform:uppercase;
      white-space:nowrap;letter-spacing:.02em;
    }
    .m-univ-nav-item .mni{font-size:27px;line-height:30px;filter:grayscale(.28)}
    .m-univ-nav-item.active,.m-univ-nav-item.gold{color:#ff6500}
    .m-univ-nav-item.active .mni{filter:none}
  }
</style>

{% set mobile_active = request.endpoint %}
<nav class="m-univ-nav" aria-label="Navigation principale">
  <a class="m-univ-nav-item{% if mobile_active == 'accueil' %} active{% endif %}" href="/accueil"><span class="mni">🏠</span><span>Accueil</span></a>
  <a class="m-univ-nav-item{% if mobile_active in ['academie','formation'] %} active{% endif %}" href="/academie"><span class="mni">🎓</span><span>Académie</span></a>
  <a class="m-univ-nav-item{% if mobile_active in ['trader_lab','analyse_ia','simulateur','journal','trade_score','calculateur','trust_center'] %} active{% endif %}" href="/trader-lab"><span class="mni">◈</span><span>Trader Lab</span></a>
  <a class="m-univ-nav-item{% if mobile_active == 'canal' %} active{% endif %}" href="/canal"><span class="mni">📡</span><span>Live</span></a>
  <a class="m-univ-nav-item{% if mobile_active in ['dashboard','parrainage','faq','support'] %} active{% endif %}" href="/dashboard"><span class="mni">👤</span><span>Profil</span></a>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.querySelector('.m-univ-nav');
    var active = nav && nav.querySelector('.active');
    if (!nav || !active || window.innerWidth > 768) return;
    nav.scrollLeft = Math.max(0, active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2);
  });
</script>
