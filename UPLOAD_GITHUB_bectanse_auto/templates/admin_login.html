<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bectanse Admin</title>

<link rel="stylesheet" href="/static/admin-workspace.css?v=20261010-1">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f3f0;color:#282b2e;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:100%;max-width:450px;background:#fff;border:1px solid #e3e2de;border-radius:22px;padding:38px;box-shadow:0 12px 50px #39255c08}.logo{display:flex;justify-content:center;align-items:center;gap:10px;font-size:23px;font-weight:700;letter-spacing:-.7px}.logo:before{content:'';background-image:url('/static/icons/bectanse-icon-v2-192.png');background-size:cover;display:grid;place-items:center;width:39px;height:39px;background-color:#070807;color:white;border-radius:11px;font-size:28px;letter-spacing:-2px;padding-right:3px}.sub{text-align:center;font-size:12px;color:#81788e;margin:8px 0 30px}h1{font-size:22px;line-height:1.4;letter-spacing:-.5px;margin:0 0 8px}.intro{font-size:13px;color:#81788e;margin:0 0 24px}label{display:block;font-size:12px;font-weight:550;color:#655971;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid #ddd5e9;border-radius:9px;background:#fdfcfe;color:#30283c;font:16px system-ui}input:focus-visible,button:focus-visible{outline:3px solid #d88d6b;outline-offset:3px}.btn{width:100%;border:0;padding:13px 18px;border-radius:10px;background:#b7502b;color:#fff;font:550 14px system-ui;margin-top:20px;cursor:pointer}.btn:hover{background:#903e20}.error{font-size:13px;color:#b04458;background:#fff3f5;border:1px solid #efd6dd;border-radius:9px;padding:12px 14px;margin-top:18px}.footer{margin:24px 0 0;color:#958c9f;font-size:11px;text-align:center}@media(max-width:480px){.box{padding:28px 23px}}
</style>
<link rel="stylesheet" href="/static/css/academy-pages.css?v=20261011-5">
<link rel="stylesheet" href="/static/css/academy-product.css?v=20261011-5">
<link rel="stylesheet" href="/static/css/site-finishes.css?v=20261011-viewport2">
</head>
<body data-ui-screen="admin_login">

<main class="box">
  <div class="logo">Bectanse Académie</div>
  <div class="sub">Espace administration</div><h1>Bienvenue dans votre espace</h1><p class="intro">Connectez-vous pour gérer les membres, les contenus et les opérations de l’académie.</p>
  <form method="POST" action="/admin-panel/login">
    <input type="hidden" name="next" value="{{ next_path or '/admin-panel' }}">
    <label for="admin-key">Clé d’accès administrateur</label>
    <input id="admin-key" type="password" name="key" required autocomplete="current-password" placeholder="••••••••••••••••••••">
    <button class="btn" type="submit">Se connecter</button>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  </form><p class="footer">Accès réservé à l’équipe Bectanse Académie.</p>
</main>
<script src="/static/source-guard.js" defer></script>
<script src="/static/js/academy-product.js?v=20261011-viewport2" defer></script>
</body>
</html>
